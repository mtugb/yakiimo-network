plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id "xyz.jpenilla.run-paper" version "3.1.0"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven {
        name = "PaperMC本体ののAPIだよ"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // Multi Verse Plugin
    maven { url = "https://repo.onarandombox.com/content/groups/public/" }
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    compileOnly "io.papermc.paper:paper-api:26.2.build.+"
    compileOnly 'org.mvplugins.multiverse.core:multiverse-core:5.8.1'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'win.yakiimo.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'server-core'
    archiveVersion = '0.0.1'
}

tasks {
    runServer {
        minecraftVersion("26.2")
        downloadPlugins {
            hangar("Multiverse-Core", "5.8.1")
            // 他に modrinth(id, version) / github(owner, repo, tag, assetName) / url(urlString) も使える
        }
    }
}
